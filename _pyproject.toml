[project]
name = "foundationl_models"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # PyTorch con CUDA 12.6
    "torch==2.8.0+cu126",
    "torchvision==0.23.0+cu126",
    "torchaudio==2.8.0+cu126",
    # Transformers y HuggingFace
    "transformers",
    "huggingface-hub[hf-xet]",
    "accelerate",
    # Visión
    "opencv-python",
    # Utilidades para imágenes y datos
    "pillow",
    "numpy",
    "matplotlib",
    "requests",
    # Jupyter para notebooks (sin ipywidgets que causa problemas)
    "jupyter",
    "ipykernel",
]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu126"
extra-index-url = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"
