<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tema introductorio sobre detección de objetos y evaluación mediante IoU.">
  <title>{{TOPIC_TITLE}} · {{COURSE_TITLE}}</title>
  <link rel="stylesheet" href="{{REL_PATH:src/styles/tokens.css}}">
  <link rel="stylesheet" href="{{REL_PATH:src/styles/base.css}}">
  <link rel="stylesheet" href="{{REL_PATH:src/styles/reading.css}}">
  <link rel="stylesheet" href="{{REL_PATH:src/styles/widgets.css}}">
</head>
<body>
  <a href="#reading-main" class="skip-link">Saltar al tema</a>
  <header class="reading-header">
    <a href="{{REL_PATH:index.html}}" class="back-link"><span aria-hidden="true">←</span> Curso</a>
    <span class="reading-topic-title">{{TOPIC_TITLE}}</span>
    <a href="{{PRESENTATION_URL}}" class="presentation-link" id="btn-mode-presentation">Presentar</a>
  </header>
  <div class="reading-layout">
    <aside class="reading-sidebar" aria-label="Índice del tema">
      <details open class="sidebar-details">
        <summary>En este tema</summary>
        <ol class="topic-index-list">{{TOPIC_INDEX}}</ol>
      </details>
    </aside>
    <main id="reading-main" class="reading-content">{{CONTENT}}</main>
  </div>
  <footer class="reading-footer">
    <a href="{{REL_PATH:index.html}}">← Volver al curso</a>
    <span class="reading-footer-links">
      <a href="{{PDF_URL}}" download>Descargar PDF</a>
      <a href="{{REL_PATH:creditos.html}}">Créditos</a>
    </span>
  </footer>
  <script type="module" src="{{REL_PATH:src/js/reading.js}}"></script>
</body>
</html>
